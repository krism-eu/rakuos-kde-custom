name: Build RakuOS KDE Custom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/krism-eu/rakuos-kde-custom

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: redhat-actions/buildah-build@v2
        with:
          image: rakuos-kde-custom
          tags: latest ${{ github.sha }}
          containerfiles: |
            ./Containerfile

      - name: Push image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: rakuos-kde-custom
          tags: latest ${{ github.sha }}
          registry: ghcr.io/krism-eu
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
